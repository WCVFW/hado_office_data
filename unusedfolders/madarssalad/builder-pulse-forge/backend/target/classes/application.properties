# Application Configuration
spring.application.name=fresh-meals-api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fresh_meals_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpass1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization (disabled)
spring.sql.init.mode=never

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://*.projects.builder.codes
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Logging Configuration
logging.level.com.freshmeals=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=${JWT_SECRET:myVerySecretKeyForFreshMealsAppThatIsLongEnoughForSecurity}
jwt.expiration=86400000

# Razorpay Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}

# Email Configuration
email.smtp.host=${SMTP_HOST:smtp.gmail.com}
email.smtp.port=${SMTP_PORT:587}
email.smtp.username=${SMTP_USERNAME:your_email@gmail.com}
email.smtp.password=${SMTP_PASSWORD:your_app_password}

# File Upload Configuration
file.upload.dir=${FILE_UPLOAD_DIR:./uploads}
file.upload.max-size=10MB

# Management/Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
